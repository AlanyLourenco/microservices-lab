<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" font-family="Segoe UI, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f2937"/>
    </marker>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
  </defs>
  <rect width="1000" height="660" fill="#fff"/>

  <!-- Participantes -->
  <g font-weight="700" text-anchor="middle">
    <rect x="30" y="20" width="110" height="36" rx="6" fill="#f3f4f6" stroke="#374151"/><text x="85" y="43">Cliente</text>
    <rect x="215" y="20" width="130" height="36" rx="6" fill="#dbeafe" stroke="#1d4ed8"/><text x="280" y="43">Pedido</text>
    <rect x="425" y="20" width="130" height="36" rx="6" fill="#dcfce7" stroke="#15803d"/><text x="490" y="43">Estoque</text>
    <rect x="630" y="20" width="130" height="36" rx="6" fill="#fffbeb" stroke="#b45309"/><text x="695" y="43">RabbitMQ</text>
    <rect x="835" y="20" width="130" height="36" rx="6" fill="#ede9fe" stroke="#6d28d9"/><text x="900" y="43">Pagamento</text>
  </g>
  <g stroke="#9ca3af" stroke-dasharray="4 4">
    <line x1="85" y1="56" x2="85" y2="645"/><line x1="280" y1="56" x2="280" y2="645"/>
    <line x1="490" y1="56" x2="490" y2="645"/><line x1="695" y1="56" x2="695" y2="645"/>
    <line x1="900" y1="56" x2="900" y2="645"/>
  </g>

  <!-- 1 -->
  <line x1="85" y1="88" x2="278" y2="88" stroke="#1f2937" stroke-width="1.6" marker-end="url(#s)"/>
  <text x="92" y="82">1. POST /pedidos {produtoId, quantidade}</text>
  <rect x="290" y="98" width="190" height="22" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="296" y="113">2. gera correlationId (UUID)</text>

  <!-- 3 -->
  <line x1="280" y1="146" x2="488" y2="146" stroke="#1f2937" stroke-width="1.6" marker-end="url(#s)"/>
  <text x="287" y="140">3. PUT /produtos/{id}/reservar  [X-Correlation-Id]</text>
  <rect x="500" y="156" width="300" height="22" rx="4" fill="#f0fdf4" stroke="#86efac"/>
  <text x="506" y="171">UPDATE … WHERE quantidade ≥ q  +  INSERT reserva</text>
  <line x1="490" y1="204" x2="282" y2="204" stroke="#1f2937" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#s)"/>
  <text x="292" y="198">4. 200 OK   (409 / 404: erro ao cliente, fim)</text>

  <!-- 5 -->
  <rect x="290" y="216" width="395" height="22" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="296" y="231">5. 1 transação: INSERT pedido (AGUARDANDO_PAGAMENTO) + INSERT outbox</text>
  <line x1="280" y1="262" x2="87" y2="262" stroke="#1f2937" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#s)"/>
  <text x="96" y="256">6. 201 Created + X-Correlation-Id</text>

  <!-- 7 -->
  <line x1="280" y1="304" x2="693" y2="304" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="287" y="298">7. relay da outbox publica pedido.criado (persistente; aguarda confirm)</text>
  <line x1="695" y1="344" x2="898" y2="344" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="702" y="338">8. entrega (prefetch 1)</text>
  <rect x="640" y="356" width="350" height="22" rx="4" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="646" y="371">9. INSERT pagamento: ~80% APROVADO / ~20% REJEITADO</text>
  <line x1="900" y1="404" x2="697" y2="404" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="706" y="398">10. pagamento.processado + ack</text>

  <!-- 11 -->
  <line x1="695" y1="446" x2="282" y2="446" stroke="#b45309" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#a)"/>
  <text x="292" y="440">11. entrega {pedidoId, status, correlationId}</text>

  <!-- alt -->
  <rect x="200" y="462" width="380" height="64" fill="none" stroke="#6b7280"/>
  <path d="M200,462 h120 v16 l-8,8 h-112 z" fill="#f3f4f6" stroke="#6b7280"/>
  <text x="206" y="478" font-size="11" font-weight="600">alt [status = REJEITADO]</text>
  <line x1="280" y1="508" x2="488" y2="508" stroke="#1f2937" stroke-width="1.6" marker-end="url(#s)"/>
  <text x="287" y="502">12. PUT /reservas/{cid}/liberar (compensação)</text>

  <rect x="290" y="542" width="330" height="22" rx="4" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="296" y="557">13. UPDATE status: PAGO | REJEITADO (idempotente)</text>

  <text x="30" y="600" font-size="11.5" fill="#374151">Setas cheias: síncrono (HTTP). Tracejadas laranja: assíncrono (AMQP). Tracejadas pretas: respostas.</text>
  <text x="30" y="618" font-size="11.5" fill="#374151">Após o passo 6 o cliente já tem a resposta: os passos 7 a 13 acontecem em segundo plano, mesmo que o Pagamento esteja fora do ar.</text>
  <text x="30" y="636" font-size="11.5" fill="#374151">O mesmo correlationId acompanha todos os passos (cabeçalho HTTP, corpo e propriedades das mensagens, logs e bancos).</text>
</svg>
